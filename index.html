<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Color Studio</title>
  <script>
    if (new URLSearchParams(window.location.search).get("embed") === "1") {
      document.documentElement.classList.add("is-embedded");
    }
  </script>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #252522;
      background: #f5f5f5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px;
    }

    button, input { font: inherit; }

    .page {
      width: min(100%, 1500px);
      margin: 0 auto;
    }

    .is-embedded body {
      min-height: 0;
      padding: 12px;
      background: transparent;
    }

    .is-embedded .page {
      width: 100%;
      max-width: none;
    }

    .is-embedded header,
    .is-embedded .intro,
    .is-embedded footer {
      display: none;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
      align-items: start;
      gap: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0 48px;
    }

    .brand { font-size: 15px; font-weight: 650; letter-spacing: -0.03em; }

    .eyebrow {
      color: #77766f;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .intro { margin-bottom: 28px; }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2.4rem, 7vw, 4.5rem);
      font-weight: 500;
      letter-spacing: -0.07em;
    }

    .intro p {
      margin: 0;
      color: #77766f;
      font-size: 15px;
      line-height: 1.6;
    }

    .palette-section {
      min-width: 0;
      padding: 20px;
      border: 1px solid #e6e3dc;
      border-radius: 22px;
      background: #fbfaf7;
      box-shadow: 0 18px 55px rgb(47 42 32 / 6%);
    }

    .palette-heading {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 24px;
      margin-bottom: 22px;
    }

    .palette-heading h2 {
      margin: 7px 0 0;
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 500;
      letter-spacing: -0.055em;
    }

    .palette-heading p {
      max-width: 290px;
      margin: 0;
      color: #77766f;
      font-size: 13px;
      line-height: 1.55;
    }

    .palette-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 18px 0 16px;
    }

    .palette-tool-button {
      min-height: 36px;
      padding: 0 11px;
      border: 1px solid #e3e0d9;
      border-radius: 8px;
      background: #fff;
      color: #373731;
      font-size: 11px;
      cursor: pointer;
    }

    .palette-tool-button:hover { background: #f6f4ef; }

    .palette-tool-button.primary {
      border-color: #292925;
      background: #292925;
      color: #fff;
    }

    .palette-tool-button.primary:hover { background: #45453f; }

    .palette-tool-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .palette-status {
      min-height: 17px;
      margin: 12px 2px 0;
      color: #77766f;
      font-size: 11px;
    }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 9px;
    }

    .palette-color {
      min-width: 0;
      padding: 7px;
      border: 1px solid #e9e6df;
      border-radius: 13px;
      background: #fff;
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }

    .palette-chip {
      min-height: clamp(110px, 14vw, 190px);
      border-radius: 8px;
    }

    .palette-color.is-locked {
      border-color: #817b6b;
      box-shadow: 0 0 0 2px #e9e6df;
    }

    .palette-actions {
      display: flex;
      justify-content: flex-end;
      gap: 2px;
      margin-top: 8px;
    }

    .palette-action {
      display: grid;
      width: 22px;
      height: 26px;
      flex: 0 0 22px;
      place-items: center;
      padding: 0;
      border: 1px solid #e3e0d9;
      border-radius: 7px;
      background: #fff;
      color: #77766f;
      cursor: pointer;
      transition: color 120ms ease, background 120ms ease, border-color 120ms ease;
    }

    .palette-action:hover {
      border-color: #c9c5bb;
      background: #f6f4ef;
      color: #252522;
    }

    .palette-action[aria-pressed="true"] {
      border-color: #817b6b;
      background: #efede7;
      color: #252522;
    }

    .palette-action:focus-visible {
      outline: 2px solid #817b6b;
      outline-offset: 2px;
    }

    .palette-action:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .palette-action svg { width: 15px; height: 15px; }

    .palette-name {
      min-height: 2.4em;
      margin: 8px 1px 3px;
      color: #77766f;
      font-size: 10px;
      line-height: 1.2;
    }

    .palette-hex {
      margin: 0 1px 2px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: clamp(9px, 0.75vw, 11px);
      letter-spacing: 0;
      white-space: nowrap;
    }

    .studio-card {
      min-width: 0;
      padding: 22px;
      border: 1px solid #e6e3dc;
      border-radius: 22px;
      background: #fbfaf7;
      box-shadow: 0 18px 55px rgb(47 42 32 / 6%);
    }

    .swatch {
      min-height: 230px;
      border-radius: 15px;
      background: #b9cec3;
      transition: background-color 120ms ease;
    }

    .swatch-caption {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 18px 8px 20px;
    }

    .swatch-caption p { margin: 0; font-size: 13px; }
    .swatch-caption .eyebrow { font-size: 10px; }

    .random-button {
      padding: 9px 12px;
      border: 1px solid #e3e0d9;
      border-radius: 9px;
      background: #fff;
      color: #373731;
      font-size: 12px;
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease;
    }

    .random-button:hover {
      border-color: #cbc8c0;
      background: #f6f4ef;
    }

    .editor {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 18px 8px 8px;
      border-top: 1px solid #e9e6df;
    }

    .editor-section { min-width: 0; }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 28px;
      margin-bottom: 14px;
    }

    .mode-switch {
      display: inline-flex;
      gap: 2px;
      padding: 3px;
      border: 1px solid #e8e5de;
      border-radius: 9px;
      background: #f4f2ed;
    }

    .mode-button {
      padding: 6px 9px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #77766f;
      font-size: 11px;
      cursor: pointer;
    }

    .mode-button[aria-pressed="true"] {
      background: #fff;
      color: #252522;
      box-shadow: 0 1px 3px rgb(37 37 34 / 10%);
    }

    .hex-entry {
      display: flex;
      gap: 8px;
    }

    .hex-entry input, .channel-input {
      min-width: 0;
      height: 42px;
      border: 1px solid #e3e0d9;
      border-radius: 9px;
      outline: none;
      background: #fff;
      color: #252522;
    }

    .hex-entry input:focus, .channel-input:focus {
      border-color: #aaa79d;
      box-shadow: 0 0 0 3px rgb(150 145 132 / 12%);
    }

    .hex-entry input {
      width: 100%;
      padding: 0 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.04em;
    }

    .actions-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
    }

    .copy-button {
      padding: 0 13px;
      border: 1px solid #e3e0d9;
      border-radius: 9px;
      background: #fff;
      color: #373731;
      font-size: 12px;
      cursor: pointer;
    }

    .copy-button:hover { background: #f6f4ef; }

    .apply-button {
      flex: 0 0 auto;
      padding: 0 13px;
      border: 1px solid #292925;
      border-radius: 9px;
      background: #292925;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
    }

    .apply-button:hover { background: #45453f; }

    .channel-fields {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .channel-fields.cmyk-fields { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    [hidden] { display: none !important; }

    .channel-label {
      display: grid;
      gap: 6px;
      color: #77766f;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .channel-input {
      width: 100%;
      padding: 0 4px;
      font-size: 12px;
      letter-spacing: 0;
    }

    .slider-list { display: grid; gap: 16px; }

    .slider-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      color: #77766f;
      font-size: 12px;
    }

    .slider-label output {
      color: #252522;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
    }

    input[type="range"] {
      appearance: none;
      display: block;
      width: 100%;
      height: 20px;
      margin: 0;
      background: transparent;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 8px;
      border-radius: 999px;
      background: #dedbd4;
    }

    input[type="range"]::-moz-range-track {
      height: 8px;
      border-radius: 999px;
      background: #dedbd4;
    }

    #hue-slider::-webkit-slider-runnable-track {
      background: linear-gradient(90deg, #f33, #ff3, #3d5, #3dd, #46f, #d4f, #f33);
    }

    #hue-slider::-moz-range-track {
      background: linear-gradient(90deg, #f33, #ff3, #3d5, #3dd, #46f, #d4f, #f33);
    }

    #saturation-slider::-webkit-slider-runnable-track {
      background: linear-gradient(90deg, #d7d4cd, var(--hue-color, #80a899));
    }

    #saturation-slider::-moz-range-track {
      background: linear-gradient(90deg, #d7d4cd, var(--hue-color, #80a899));
    }

    #brightness-slider::-webkit-slider-runnable-track {
      background: linear-gradient(90deg, #151513, var(--full-color, #fff));
    }

    #brightness-slider::-moz-range-track {
      background: linear-gradient(90deg, #151513, var(--full-color, #fff));
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 18px;
      height: 18px;
      margin-top: -5px;
      border: 3px solid #fff;
      border-radius: 50%;
      background: #252522;
      box-shadow: 0 1px 4px rgb(0 0 0 / 25%);
    }

    input[type="range"]::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border: 3px solid #fff;
      border-radius: 50%;
      background: #252522;
      box-shadow: 0 1px 4px rgb(0 0 0 / 25%);
    }

    .status {
      min-height: 18px;
      margin: 12px 0 0;
      color: #77766f;
      font-size: 12px;
    }

    footer { padding: 22px 0; color: #929087; font-size: 12px; }

    @media (max-width: 1300px) {
      .workspace { grid-template-columns: 1fr; }
      .palette-chip { min-height: clamp(130px, 22vw, 210px); }
    }

    @media (max-width: 650px) {
      body { padding: 20px; }
      header { padding-bottom: 36px; }
      .studio-card { padding: 16px; }
      .swatch { min-height: 220px; }
      .editor { grid-template-columns: 1fr; gap: 26px; }
      .palette-section { padding: 16px; }
      .palette-heading { align-items: start; flex-direction: column; gap: 9px; }
      .palette-heading p { max-width: none; }
      .palette-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
      .palette-chip { min-height: 125px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="brand">Color Studio</div>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <h1 id="page-title">Find your color.</h1>
      <p>A quiet little space to explore color, one shade at a time.</p>
    </section>

    <div class="workspace">
    <section class="palette-section" aria-labelledby="palette-title">
      <div class="palette-heading">
        <div>
          <span class="eyebrow">Curated palette</span>
          <h2 id="palette-title">Supporting colors</h2>
        </div>
        <p>A balanced mix of neutrals, a deeper anchor, and softened accents.</p>
      </div>
      <div class="palette-tools" aria-label="Palette actions">
        <button class="palette-tool-button" id="refresh-unlocked" type="button">Refresh unlocked</button>
        <button class="palette-tool-button" id="new-direction" type="button" title="Replaces all colors, including locked ones">New direction</button>
        <button class="palette-tool-button primary" id="export-svg" type="button">Export SVG</button>
      </div>
      <div class="palette-grid" id="palette-grid" aria-live="polite"></div>
      <p class="palette-status" id="palette-status" role="status" aria-live="polite"></p>
    </section>

    <section class="studio-card" aria-label="Starting color editor">
      <div class="swatch" aria-label="Current color preview"></div>
      <div class="swatch-caption">
        <p>Current color</p>
        <button class="random-button" id="random-color" type="button">Generate random color</button>
      </div>

      <div class="editor">
        <section class="editor-section" aria-labelledby="values-heading">
          <div class="section-heading">
            <span class="eyebrow" id="values-heading">Color values</span>
            <div class="mode-switch" aria-label="Color value format">
              <button class="mode-button" type="button" data-mode="hex" aria-pressed="true">HEX</button>
              <button class="mode-button" type="button" data-mode="rgb" aria-pressed="false">RGB</button>
              <button class="mode-button" type="button" data-mode="cmyk" aria-pressed="false">CMYK</button>
            </div>
          </div>

          <div class="hex-entry value-fields" data-fields="hex">
            <label class="eyebrow" for="hex-input" hidden>HEX code</label>
            <input id="hex-input" type="text" value="#B9CEC3" spellcheck="false" aria-label="HEX color code">
          </div>

          <div class="channel-fields value-fields" data-fields="rgb" hidden>
            <label class="channel-label">R<input class="channel-input" id="red-input" type="number" min="0" max="255" step="1" aria-label="Red from 0 to 255"></label>
            <label class="channel-label">G<input class="channel-input" id="green-input" type="number" min="0" max="255" step="1" aria-label="Green from 0 to 255"></label>
            <label class="channel-label">B<input class="channel-input" id="blue-input" type="number" min="0" max="255" step="1" aria-label="Blue from 0 to 255"></label>
          </div>

          <div class="channel-fields cmyk-fields value-fields" data-fields="cmyk" hidden>
            <label class="channel-label">C<input class="channel-input" id="cyan-input" type="number" min="0" max="100" step="1" aria-label="Cyan percent"></label>
            <label class="channel-label">M<input class="channel-input" id="magenta-input" type="number" min="0" max="100" step="1" aria-label="Magenta percent"></label>
            <label class="channel-label">Y<input class="channel-input" id="yellow-input" type="number" min="0" max="100" step="1" aria-label="Yellow percent"></label>
            <label class="channel-label">K<input class="channel-input" id="black-input" type="number" min="0" max="100" step="1" aria-label="Black percent"></label>
          </div>

          <div class="actions-row">
            <button class="copy-button" id="copy-hex" type="button">Copy HEX</button>
            <button class="apply-button" id="apply-color" type="button">Apply values</button>
          </div>
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </section>

        <section class="editor-section" aria-labelledby="adjust-heading">
          <div class="section-heading">
            <span class="eyebrow" id="adjust-heading">Adjust color</span>
            <span class="eyebrow">HSB</span>
          </div>
          <div class="slider-list">
            <label>
              <span class="slider-label">Hue <output id="hue-value">0°</output></span>
              <input id="hue-slider" type="range" min="0" max="359" value="0" aria-label="Hue">
            </label>
            <label>
              <span class="slider-label">Saturation <output id="saturation-value">0%</output></span>
              <input id="saturation-slider" type="range" min="0" max="100" value="0" aria-label="Saturation">
            </label>
            <label>
              <span class="slider-label">Brightness <output id="brightness-value">0%</output></span>
              <input id="brightness-slider" type="range" min="0" max="100" value="0" aria-label="Brightness">
            </label>
          </div>
        </section>
      </div>
    </section>

    </div>

    <footer>Color Studio · A small study in color</footer>
  </main>

  <script>
    const swatch = document.querySelector(".swatch");
    const hexInput = document.querySelector("#hex-input");
    const statusMessage = document.querySelector("#status");
    const modeButtons = document.querySelectorAll(".mode-button");
    const valueFields = document.querySelectorAll(".value-fields");
    const paletteGrid = document.querySelector("#palette-grid");
    const hueSlider = document.querySelector("#hue-slider");
    const saturationSlider = document.querySelector("#saturation-slider");
    const brightnessSlider = document.querySelector("#brightness-slider");
    let activeMode = "hex";
    let color = { r: 185, g: 206, b: 195 };
    let palette = [];
    const paletteRoles = ["Light neutral", "Dark neutral", "Deep anchor", "Quiet contrast", "Considered accent"];

    function rgbToHex(rgb) {
      return "#" + [rgb.r, rgb.g, rgb.b]
        .map(channel => channel.toString(16).padStart(2, "0"))
        .join("")
        .toUpperCase();
    }

    function rgbToHsv(rgb) {
      const r = rgb.r / 255;
      const g = rgb.g / 255;
      const b = rgb.b / 255;
      const max = Math.max(r, g, b);
      const min = Math.min(r, g, b);
      const difference = max - min;
      let hue = 0;

      if (difference !== 0) {
        if (max === r) hue = 60 * (((g - b) / difference) % 6);
        else if (max === g) hue = 60 * ((b - r) / difference + 2);
        else hue = 60 * ((r - g) / difference + 4);
      }

      if (hue < 0) hue += 360;
      return {
        h: hue,
        s: max === 0 ? 0 : difference / max * 100,
        v: max * 100
      };
    }

    function hsvToRgb(hue, saturation, brightness) {
      const h = ((hue % 360) + 360) % 360;
      const s = saturation / 100;
      const v = brightness / 100;
      const chroma = v * s;
      const x = chroma * (1 - Math.abs((h / 60) % 2 - 1));
      const match = v - chroma;
      let channels;

      if (h < 60) channels = [chroma, x, 0];
      else if (h < 120) channels = [x, chroma, 0];
      else if (h < 180) channels = [0, chroma, x];
      else if (h < 240) channels = [0, x, chroma];
      else if (h < 300) channels = [x, 0, chroma];
      else channels = [chroma, 0, x];

      return {
        r: Math.round((channels[0] + match) * 255),
        g: Math.round((channels[1] + match) * 255),
        b: Math.round((channels[2] + match) * 255)
      };
    }

    function rgbToCmyk(rgb) {
      const r = rgb.r / 255;
      const g = rgb.g / 255;
      const b = rgb.b / 255;
      const black = 1 - Math.max(r, g, b);
      if (black === 1) return { c: 0, m: 0, y: 0, k: 100 };
      return {
        c: (1 - r - black) / (1 - black) * 100,
        m: (1 - g - black) / (1 - black) * 100,
        y: (1 - b - black) / (1 - black) * 100,
        k: black * 100
      };
    }

    const PALETTE_VARIATION_COUNT = 8;

    const balancedRecipes = {
      light: [38, 13, 97],
      dark: [30, 16, 30],
      contrast: [218, 18, 74],
      accent: [28, 32, 75]
    };

    function varyColor(recipe, variation, role) {
      const hueAdjustments = [0, -5, 5, -10, 10, -16, 16, 2];
      const satAdjustments = [0, 3, -2, 5, -4, 2, -5, 4];
      const valueAdjustments = [0, 2, -2, 3, -3, -1, 1, -4];
      const hue = recipe[0] + hueAdjustments[variation];
      let saturation = recipe[1] + satAdjustments[variation];
      let brightness = recipe[2] + valueAdjustments[variation];

      if (role === "neutral-light") saturation = Math.max(6, Math.min(18, saturation));
      if (role === "neutral-dark") saturation = Math.max(8, Math.min(24, saturation));
      if (role === "support") saturation = Math.max(12, Math.min(34, saturation));
      if (role === "accent") saturation = Math.max(18, Math.min(48, saturation));
      brightness = Math.max(role === "neutral-dark" ? 20 : 28, Math.min(role === "neutral-light" ? 99 : 88, brightness));
      return hsvToRgb(hue, saturation, brightness);
    }

    function createPaletteColor(index, variation = 0) {
      const base = rgbToHsv(color);
      const baseHue = base.s < 3 ? 218 : base.h;
      const variant = variation % PALETTE_VARIATION_COUNT;
      const anchorHueOffsets = [0, -5, 5, -10, 10, -16, 16, 2];
      let recipe;
      let role;

      if (index === 0) {
        recipe = balancedRecipes.light;
        role = "neutral-light";
      } else if (index === 1) {
        recipe = balancedRecipes.dark;
        role = "neutral-dark";
      } else if (index === 2) {
        const anchorSaturation = Math.min(42, Math.max(20, base.s * 0.52 + 8));
        const anchorBrightness = Math.max(32, Math.min(48, base.v * 0.52));
        recipe = [(baseHue + anchorHueOffsets[variant] + 360) % 360, anchorSaturation, anchorBrightness];
        role = "anchor";
      } else if (index === 3) {
        recipe = balancedRecipes.contrast;
        role = "support";
      } else {
        recipe = balancedRecipes.accent;
        role = "accent";
      }

      return {
        role: paletteRoles[index],
        color: varyColor(recipe, variant, role),
        variation: variant,
        locked: false
      };
    }

    function chooseDifferentVariation(currentVariation) {
      const change = 1 + Math.floor(Math.random() * (PALETTE_VARIATION_COUNT - 1));
      return (currentVariation + change) % PALETTE_VARIATION_COUNT;
    }

    function refreshUnlockedColors() {
      if (palette.length === 0) {
        palette = paletteRoles.map((_, index) => createPaletteColor(index));
      } else {
        palette = palette.map((slot, index) =>
          slot.locked ? slot : createPaletteColor(index, slot.variation)
        );
      }
      renderPalette();
    }

    function renderPalette() {
      paletteGrid.innerHTML = palette.map((item, index) => {
        const hex = rgbToHex(item.color);
        const lockLabel = item.locked ? `Unlock ${item.role}` : `Lock ${item.role}`;
        const lockIcon = item.locked
          ? '<path d="M7 10V7a5 5 0 0 1 10 0v3"/><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M12 14v3"/>'
          : '<path d="M7 10V7a5 5 0 0 1 9.6-2"/><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M12 14v3"/>';
        return `
          <article class="palette-color${item.locked ? " is-locked" : ""}">
            <div class="palette-chip" style="background-color: ${hex}" aria-label="${item.role}, ${hex}"></div>
            <p class="palette-name">${item.role}</p>
            <p class="palette-hex">${hex}</p>
            <div class="palette-actions">
              <button class="palette-action" type="button" data-action="lock" data-index="${index}" aria-label="${lockLabel}" aria-pressed="${item.locked}" title="${lockLabel}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${lockIcon}</svg>
              </button>
              <button class="palette-action" type="button" data-action="refresh" data-index="${index}" aria-label="Regenerate ${item.role}" title="Regenerate ${item.role}" ${item.locked ? "disabled" : ""}>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M19 12a7 7 0 0 0-12-5L4 10M4 17v-5h5"/><path d="M5 12a7 7 0 0 0 12 5l3-3"/></svg>
              </button>
              <button class="palette-action" type="button" data-action="copy" data-index="${index}" aria-label="Copy ${item.role} HEX ${hex}" title="Copy ${hex}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h2"/></svg>
              </button>
            </div>
          </article>
        `;
      }).join("");
      document.querySelector("#refresh-unlocked").disabled = palette.every(item => item.locked);
    }

    async function copyPaletteHex(hex, role) {
      let copied = false;

      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(hex);
          copied = true;
        } catch {
          // Use the local-page fallback if clipboard permission is unavailable.
        }
      }

      if (!copied) {
        const temporaryField = document.createElement("textarea");
        temporaryField.value = hex;
        temporaryField.style.position = "fixed";
        temporaryField.style.opacity = "0";
        document.body.appendChild(temporaryField);
        temporaryField.select();
        copied = document.execCommand("copy");
        temporaryField.remove();
      }

      document.querySelector("#palette-status").textContent = copied
        ? `Copied ${hex} for ${role}.`
        : "Copy was unavailable. Select the HEX value and copy it manually.";
    }

    function regenerateUnlockedColors() {
      let refreshedCount = 0;
      palette = palette.map((item, index) => {
        if (item.locked) return item;
        refreshedCount += 1;
        return createPaletteColor(index, chooseDifferentVariation(item.variation));
      });
      renderPalette();
      document.querySelector("#palette-status").textContent = refreshedCount
        ? `Refreshed ${refreshedCount} unlocked colors.`
        : "All colors are locked. Unlock one to refresh suggestions.";
    }

    function startNewDirection() {
      palette = palette.map((item, index) =>
        createPaletteColor(index, chooseDifferentVariation(item.variation))
      );
      renderPalette();
      document.querySelector("#palette-status").textContent = "New direction created; all colors are unlocked.";
    }

    function exportPaletteSVG() {
      const squareSize = 164;
      const left = 48;
      const gap = 36;
      const top = 34;
      const width = left * 2 + squareSize * palette.length + gap * (palette.length - 1);
      const height = 286;
      const swatches = palette.map((item, index) => {
        const x = left + index * (squareSize + gap);
        const center = x + squareSize / 2;
        const hex = rgbToHex(item.color);
        const id = item.role.toLowerCase().replace(/[^a-z0-9]+/g, "-");
        return `
          <g id="color-${id}">
            <rect id="swatch-${id}" x="${x}" y="${top}" width="${squareSize}" height="${squareSize}" rx="16" fill="${hex}" />
            <text id="role-${id}" x="${center}" y="${top + squareSize + 26}" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#77766F">${item.role}</text>
            <text id="hex-${id}" x="${center}" y="${top + squareSize + 51}" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" fill="#252522">${hex}</text>
          </g>
        `;
      }).join("");
      const svg = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
  <title>Color Studio palette</title>
  <rect id="background" width="100%" height="100%" fill="#FFFFFF" />
  ${swatches}
</svg>`;
      const file = new Blob([svg], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(file);
      const link = document.createElement("a");
      link.href = url;
      link.download = "color-studio-palette.svg";
      document.body.appendChild(link);
      link.click();
      link.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      document.querySelector("#palette-status").textContent = "SVG palette exported.";
    }

    function renderColor() {
      swatch.style.backgroundColor = rgbToHex(color);
      hexInput.value = rgbToHex(color);

      document.querySelector("#red-input").value = color.r;
      document.querySelector("#green-input").value = color.g;
      document.querySelector("#blue-input").value = color.b;

      const cmyk = rgbToCmyk(color);
      document.querySelector("#cyan-input").value = Math.round(cmyk.c);
      document.querySelector("#magenta-input").value = Math.round(cmyk.m);
      document.querySelector("#yellow-input").value = Math.round(cmyk.y);
      document.querySelector("#black-input").value = Math.round(cmyk.k);

      const hsv = rgbToHsv(color);
      document.documentElement.style.setProperty("--hue-color", `hsl(${hsv.h}, 100%, 50%)`);
      document.documentElement.style.setProperty("--full-color", rgbToHex(hsvToRgb(hsv.h, hsv.s, 100)));
      hueSlider.value = Math.min(359, Math.round(hsv.h));
      saturationSlider.value = Math.round(hsv.s);
      brightnessSlider.value = Math.round(hsv.v);
      document.querySelector("#hue-value").textContent = `${hueSlider.value}°`;
      document.querySelector("#saturation-value").textContent = `${saturationSlider.value}%`;
      document.querySelector("#brightness-value").textContent = `${brightnessSlider.value}%`;
      refreshUnlockedColors();
    }

    async function copyHex() {
      const value = rgbToHex(color);

      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(value);
          statusMessage.textContent = `Copied ${value} to the clipboard.`;
          return;
        } catch {
          // Try the local-page fallback below.
        }
      }

      try {
        const temporaryField = document.createElement("textarea");
        temporaryField.value = value;
        temporaryField.style.position = "fixed";
        temporaryField.style.opacity = "0";
        document.body.appendChild(temporaryField);
        temporaryField.select();
        const copied = document.execCommand("copy");
        temporaryField.remove();
        statusMessage.textContent = copied
          ? `Copied ${value} to the clipboard.`
          : "Copy was unavailable. You can select the HEX value and copy it manually.";
      } catch {
        statusMessage.textContent = "Copy was unavailable. You can select the HEX value and copy it manually.";
      }
    }

    function setMode(mode) {
      activeMode = mode;
      modeButtons.forEach(button => {
        button.setAttribute("aria-pressed", button.dataset.mode === mode);
      });
      valueFields.forEach(fields => {
        fields.hidden = fields.dataset.fields !== mode;
      });
      statusMessage.textContent = "";
    }

    function applyEnteredColor() {
      if (activeMode === "hex") {
        let value = hexInput.value.trim().replace(/^#/, "");
        if (/^[0-9a-f]{3}$/i.test(value)) {
          value = value.split("").map(digit => digit + digit).join("");
        }
        if (!/^[0-9a-f]{6}$/i.test(value)) {
          statusMessage.textContent = "Enter a 3 or 6 digit HEX code, like #A1B2C3.";
          return;
        }
        color = {
          r: parseInt(value.slice(0, 2), 16),
          g: parseInt(value.slice(2, 4), 16),
          b: parseInt(value.slice(4, 6), 16)
        };
      } else if (activeMode === "rgb") {
        const rawValues = ["#red-input", "#green-input", "#blue-input"]
          .map(selector => document.querySelector(selector).value.trim());
        const values = rawValues.map(Number);
        if (rawValues.some(value => value === "") || values.some(value => !Number.isInteger(value) || value < 0 || value > 255)) {
          statusMessage.textContent = "RGB values must be whole numbers from 0 to 255.";
          return;
        }
        color = { r: values[0], g: values[1], b: values[2] };
      } else {
        const rawValues = ["#cyan-input", "#magenta-input", "#yellow-input", "#black-input"]
          .map(selector => document.querySelector(selector).value.trim());
        const values = rawValues.map(Number);
        if (rawValues.some(value => value === "") || values.some(value => !Number.isFinite(value) || value < 0 || value > 100)) {
          statusMessage.textContent = "CMYK values must be from 0 to 100 percent.";
          return;
        }
        const [c, m, y, k] = values.map(value => value / 100);
        color = {
          r: Math.round(255 * (1 - c) * (1 - k)),
          g: Math.round(255 * (1 - m) * (1 - k)),
          b: Math.round(255 * (1 - y) * (1 - k))
        };
      }

      renderColor();
      statusMessage.textContent = "Color updated.";
    }

    modeButtons.forEach(button => {
      button.addEventListener("click", () => setMode(button.dataset.mode));
    });

    paletteGrid.addEventListener("click", event => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const index = Number(button.dataset.index);
      const item = palette[index];
      if (!item) return;

      if (button.dataset.action === "lock") {
        item.locked = !item.locked;
        renderPalette();
      } else if (button.dataset.action === "refresh" && !item.locked) {
        palette[index] = createPaletteColor(index, (item.variation + 1) % PALETTE_VARIATION_COUNT);
        renderPalette();
      } else if (button.dataset.action === "copy") {
        copyPaletteHex(rgbToHex(item.color), item.role);
      }
    });

    document.querySelector("#refresh-unlocked").addEventListener("click", regenerateUnlockedColors);
    document.querySelector("#new-direction").addEventListener("click", startNewDirection);
    document.querySelector("#export-svg").addEventListener("click", exportPaletteSVG);
    document.querySelector("#apply-color").addEventListener("click", applyEnteredColor);
    document.querySelector("#copy-hex").addEventListener("click", copyHex);
    document.querySelector("#random-color").addEventListener("click", () => {
      color = {
        r: Math.floor(Math.random() * 256),
        g: Math.floor(Math.random() * 256),
        b: Math.floor(Math.random() * 256)
      };
      renderColor();
      statusMessage.textContent = "A new random color is ready.";
    });
    document.querySelectorAll(".channel-input").forEach(input => {
      input.addEventListener("keydown", event => {
        if (event.key === "Enter") applyEnteredColor();
      });
    });
    hexInput.addEventListener("keydown", event => {
      if (event.key === "Enter") applyEnteredColor();
    });

    [hueSlider, saturationSlider, brightnessSlider].forEach(slider => {
      slider.addEventListener("input", () => {
        document.querySelector("#hue-value").textContent = `${hueSlider.value}°`;
        document.querySelector("#saturation-value").textContent = `${saturationSlider.value}%`;
        document.querySelector("#brightness-value").textContent = `${brightnessSlider.value}%`;
        color = hsvToRgb(Number(hueSlider.value), Number(saturationSlider.value), Number(brightnessSlider.value));
        renderColor();
      });
    });

    renderColor();
  </script>
</body>
</html>
